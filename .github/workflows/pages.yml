name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - 'docs/performance/**'
      - 'src/**'
      - 'scripts/check-engine-budget.mjs'
      - 'global.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mayordomo.slnx

      - name: Build engine
        run: dotnet build Mayordomo.slnx --configuration Release --no-restore

      - name: Generate published engine metrics
        run: node scripts/check-engine-budget.mjs --json docs/site/engine-metrics.json

      - name: Validate static site
        run: |
          test -s docs/site/index.html
          test -s docs/site/styles.css
          test -s docs/site/site.js
          test -s docs/site/engine-metrics.json

      - name: Configure Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
