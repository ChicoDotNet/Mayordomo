name: Bug report
description: Report a reproducible public-safe defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private Mayordomo.Game code/content, personal data, or weaponizable security details.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected observable behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest reproducible steps, seed, commands, or public-safe fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit/version
      placeholder: SHA, tag, package version, or build identifier
  - type: textarea
    id: evidence
    attributes:
      label: Public-safe evidence
