name: Repository Policy

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readiness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate working branch
        if: github.event_name == 'pull_request' && github.head_ref != 'main' && github.head_ref != 'dev' && github.actor != 'dependabot[bot]'
        run: node scripts/validate-branch-name.mjs "$GITHUB_HEAD_REF"

      - name: Verify public-safe engine boundary
        run: node scripts/check-public-readiness.mjs
