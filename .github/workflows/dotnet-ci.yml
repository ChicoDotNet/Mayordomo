name: .NET CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'global.json'
      - 'scripts/validate-branch-name.mjs'
      - 'scripts/check-engine-budget.mjs'
      - 'scripts/compute-release-version*.mjs'
      - 'scripts/test-package-consumer.mjs'
      - 'README.md'
      - '.github/workflows/dotnet-ci.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'global.json'
      - 'scripts/validate-branch-name.mjs'
      - 'scripts/check-engine-budget.mjs'
      - 'scripts/compute-release-version*.mjs'
      - 'scripts/test-package-consumer.mjs'
      - 'README.md'
      - '.github/workflows/dotnet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate working branch
        if: github.event_name == 'pull_request' && github.head_ref != 'main' && github.head_ref != 'dev' && github.actor != 'dependabot[bot]'
        run: node scripts/validate-branch-name.mjs "$GITHUB_HEAD_REF"

      - name: Verify release-version contract
        run: node --test scripts/compute-release-version.test.mjs

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mayordomo.slnx

      - name: Build
        run: dotnet build Mayordomo.slnx --configuration Release --no-restore

      - name: Enforce engine footprint
        run: node scripts/check-engine-budget.mjs

      - name: Test
        run: dotnet test Mayordomo.slnx --configuration Release --no-build

      - name: Pack Mayordomo.Core consumer candidate
        run: >
          dotnet pack src/Mayordomo.Core/Mayordomo.Core.csproj
          --configuration Release
          --no-build
          --output artifacts/nuget
          -p:PackageVersion=1.0.20261004.999
          -p:AssemblyVersion=1.0.0.0
          -p:FileVersion=1.0.26277.999
          -p:InformationalVersion=1.0.20261004.999+$GITHUB_SHA
          -p:RepositoryCommit=$GITHUB_SHA

      - name: Verify package and symbol artifacts
        run: |
          test -f artifacts/nuget/Mayordomo.Core.1.0.20261004.999.nupkg
          test -f artifacts/nuget/Mayordomo.Core.1.0.20261004.999.snupkg

      - name: Smoke test installed package
        run: >
          node scripts/test-package-consumer.mjs
          artifacts/nuget
          1.0.20261004.999
