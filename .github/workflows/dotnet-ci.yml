name: .NET CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.fs'
      - '**/*.fsproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'global.json'
      - 'tools/Mayordomo.Tooling/**'
      - 'tools/Mayordomo.Tooling.Tests/**'
      - 'README.md'
      - '.github/workflows/dotnet-ci.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.fs'
      - '**/*.fsproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - 'global.json'
      - 'tools/Mayordomo.Tooling/**'
      - 'tools/Mayordomo.Tooling.Tests/**'
      - 'README.md'
      - '.github/workflows/dotnet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TOOLING_DLL: tools/Mayordomo.Tooling/bin/Release/net10.0/Mayordomo.Tooling.dll

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mayordomo.slnx

      - name: Build
        run: dotnet build Mayordomo.slnx --configuration Release --no-restore

      - name: Validate working branch
        if: github.event_name == 'pull_request' && github.head_ref != 'main' && github.head_ref != 'dev' && github.actor != 'dependabot[bot]'
        run: dotnet "$TOOLING_DLL" branch-name "$GITHUB_HEAD_REF"

      - name: Test
        run: dotnet test Mayordomo.slnx --configuration Release --no-build

      - name: Enforce engine footprint
        run: dotnet "$TOOLING_DLL" engine-budget

      - name: Pack Mayordomo.Core consumer candidate
        run: >
          dotnet pack src/Mayordomo.Core/Mayordomo.Core.csproj
          --configuration Release
          --no-build
          --output artifacts/nuget
          -p:PackageVersion=1.0.20261004.999
          -p:AssemblyVersion=1.0.0.0
          -p:FileVersion=1.0.26277.999
          -p:InformationalVersion=1.0.20261004.999+$GITHUB_SHA
          -p:RepositoryCommit=$GITHUB_SHA

      - name: Verify package and symbol artifacts
        run: |
          test -f artifacts/nuget/Mayordomo.Core.1.0.20261004.999.nupkg
          test -f artifacts/nuget/Mayordomo.Core.1.0.20261004.999.snupkg

      - name: Audit NuGet package contract
        run: >
          dotnet "$TOOLING_DLL" package-audit
          artifacts/nuget
          1.0.20261004.999
          "$GITHUB_SHA"

      - name: Smoke test installed package
        run: >
          dotnet "$TOOLING_DLL" consumer-smoke
          artifacts/nuget
          1.0.20261004.999
