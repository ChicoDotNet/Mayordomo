name: Tooling CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'tools/Mayordomo.Tooling/**'
      - 'tools/Mayordomo.Tooling.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/tooling-ci.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'tools/Mayordomo.Tooling/**'
      - 'tools/Mayordomo.Tooling.Tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/tooling-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tooling tests
        run: dotnet restore tools/Mayordomo.Tooling.Tests/Mayordomo.Tooling.Tests.fsproj

      - name: Build tooling tests
        run: dotnet build tools/Mayordomo.Tooling.Tests/Mayordomo.Tooling.Tests.fsproj --configuration Release --no-restore

      - name: Test tooling
        run: dotnet test tools/Mayordomo.Tooling.Tests/Mayordomo.Tooling.Tests.fsproj --configuration Release --no-build
