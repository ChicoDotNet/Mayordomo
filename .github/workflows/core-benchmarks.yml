name: Core Benchmarks

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/Mayordomo.Core/**'
      - 'benchmarks/Mayordomo.Core.Benchmarks/**'
      - 'tools/Mayordomo.Tooling/**'
      - 'tools/Mayordomo.Tooling.Tests/**'
      - 'global.json'
      - '.github/workflows/core-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      MAYORDOMO_BENCHMARK_ITERATIONS: '10000'
      MAYORDOMO_BENCHMARK_WARMUP: '1000'
      MAYORDOMO_BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOOLING_DLL: tools/Mayordomo.Tooling/bin/Release/net10.0/Mayordomo.Tooling.dll
      # NuGet package caching is intentionally disabled here: CI-I03 measured slower benchmark runs.

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore F# tooling
        run: dotnet restore tools/Mayordomo.Tooling/Mayordomo.Tooling.fsproj

      - name: Build F# tooling
        run: dotnet build tools/Mayordomo.Tooling/Mayordomo.Tooling.fsproj --configuration Release --no-restore

      - name: Restore benchmark harness
        run: dotnet restore benchmarks/Mayordomo.Core.Benchmarks/Mayordomo.Core.Benchmarks.csproj

      - name: Build benchmark harness
        run: dotnet build benchmarks/Mayordomo.Core.Benchmarks/Mayordomo.Core.Benchmarks.csproj --configuration Release --no-restore

      - name: Run reproducible benchmark suite
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet run \
            --project benchmarks/Mayordomo.Core.Benchmarks/Mayordomo.Core.Benchmarks.csproj \
            --configuration Release \
            --no-build \
            > artifacts/core-benchmark.json

          cat artifacts/core-benchmark.json

          {
            echo '## Mayordomo.Core benchmark'
            echo
            cat artifacts/core-benchmark.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce benchmark hard ceilings
        run: dotnet "$TOOLING_DLL" benchmark-budget artifacts/core-benchmark.json
